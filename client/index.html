<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved/system theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary title & description -->
    <title>Babatunde Ewetumo — Engineer & Designer</title>
    <meta
      name="description"
      content="Portfolio of a full-stack engineer & designer / what you do — e.g. Full-stack developer & web designer building modern web apps and digital products."
    />

    <!-- Social link preview (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myportfolio-zm51.onrender.com/" />
    <meta property="og:title" content="YOUR NAME — Your Title" />
    <meta
      property="og:description"
      content="YOUR short bio / what you do."
    />
    <meta property="og:image" content="https://myportfolio-zm51.onrender.com/preview.png" />

    <!-- Twitter/X preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YOUR NAME — Your Title" />
    <meta name="twitter:description" content="YOUR short bio / what you do." />
    <meta name="twitter:image" content="https://myportfolio-zm51.onrender.com/preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
