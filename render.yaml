# Render Blueprint — deploys the portfolio as ONE web service (backend serves
# the built React app) plus a managed PostgreSQL database.

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free

services:
  - type: web
    name: myportfolio
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: >-
      cd client && npm install --include=dev && npm run build &&
      cd ../server && npm install --include=dev && npm run build &&
      npx prisma generate
    startCommand: >-
      cd server && npx prisma db push --accept-data-loss &&
      npx tsx prisma/seed.ts && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false